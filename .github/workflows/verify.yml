name: Verify FIR RTL
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install simulator
        run: sudo apt-get update && sudo apt-get install -y ghdl
      - name: Verify both architectures
        run: python3 scripts/run_verification.py --output results/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fir-verification
          path: results/ci
